name: SEM Intel Daily Digest

on:
  schedule:
    - cron: '0 5 * * *'   # 5:00 UTC = 7:00 CET
  workflow_dispatch:        # manual trigger from GitHub UI

jobs:
  run-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Install project dependencies
        run: npm ci

      # Restore SQLite DB from cache so dedup history persists across runs
      - name: Restore articles DB cache
        uses: actions/cache@v4
        with:
          path: data/articles.db
          key: articles-db-${{ github.run_id }}
          restore-keys: |
            articles-db-

      - name: Ensure directories exist
        run: mkdir -p data output/blog output/email logs

      # Single script runs everything: scrape → score → deliver → Gmail draft
      - name: Run full pipeline
        run: bash run-daily.sh
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}

      # Commit blog output back to repo
      - name: Commit blog output
        run: |
          git config user.name "SEM Intel Agent"
          git config user.email "sem-intel-agent@noreply.github.com"
          git add output/blog/ || true
          git diff --staged --quiet || git commit -m "chore: SEM Intel Digest — $(date +%Y-%m-%d)"
          git push || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Upload logs as artifact for debugging
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sem-intel-logs-${{ github.run_id }}
          path: logs/
          retention-days: 14
